services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usage_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-usage_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      # PostgreSQL 18+ expects the volume at the parent directory so it can
      # manage major-version-specific data directories internally.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usage_dashboard} -d ${POSTGRES_DB:-usage_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/skulldorom/usage-dashboard-backend:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://usage_dashboard:${POSTGRES_PASSWORD:-change-me}@db:5432/usage_dashboard}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env. See .env.example.}
      ADMIN_SESSION_EXPIRE_HOURS: ${ADMIN_SESSION_EXPIRE_HOURS:-24}
      ADMIN_RECOVERY_CODE_EXPIRE_MINUTES: ${ADMIN_RECOVERY_CODE_EXPIRE_MINUTES:-30}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:${NGINX_HTTP_PORT:-3000},http://127.0.0.1:${NGINX_HTTP_PORT:-3000}}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-180}
      ANALYTICS_HOURLY_RETENTION_DAYS: ${ANALYTICS_HOURLY_RETENTION_DAYS:-365}
      AUTO_POLL_ENABLED: ${AUTO_POLL_ENABLED:-true}
      AUTO_POLL_INTERVAL_MINUTES: ${AUTO_POLL_INTERVAL_MINUTES:-60}
      CUSTOM_HTTP_ALLOWED_HOSTS: ${CUSTOM_HTTP_ALLOWED_HOSTS:-}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/skulldorom/usage-dashboard-frontend:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      EXTENSION_TARGET_CHROME_ID: ${EXTENSION_TARGET_CHROME_ID:-}
      EXTENSION_TARGET_EDGE_ID: ${EXTENSION_TARGET_EDGE_ID:-}
      EXTENSION_TARGET_OPERA_ID: ${EXTENSION_TARGET_OPERA_ID:-}
      EXTENSION_TARGET_FIREFOX_ID: ${EXTENSION_TARGET_FIREFOX_ID:-}
      EXTENSION_TARGET_SAFARI_ID: ${EXTENSION_TARGET_SAFARI_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
