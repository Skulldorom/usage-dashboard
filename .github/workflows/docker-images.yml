name: Docker images

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - .github/workflows/docker-images.yml
      - .github/workflows/application-release.yml
      - scripts/**
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-classification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Require exactly one release intent on every PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/application_release.py classify --pr "$PR_NUMBER"

  test-backend:
    name: Test backend (pytest + Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Release policy tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Run tests
        working-directory: backend
        run: pytest

      - name: Lint backend
        run: ruff check backend

      - name: Check backend formatting
        run: ruff format --check backend

  test-backend-migrations:
    name: Test backend migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: usage_dashboard
          POSTGRES_USER: usage_dashboard
          POSTGRES_PASSWORD: change-me
        options: >-
          --health-cmd "pg_isready -U usage_dashboard -d usage_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://usage_dashboard:change-me@localhost:5432/usage_dashboard
      ENCRYPTION_KEY: 1VlOu4U4FQvXf7z_UTd68N2IsJo87NZzxnqE6o-Wovs=
      POSTGRES_MIGRATION_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate Alembic migration chain
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify long session ID round trip
        working-directory: backend
        run: pytest tests/test_postgres_migrations.py

  test-frontend:
    name: Test frontend (test + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  build:
    name: Build ${{ matrix.component }} image
    if: github.event_name != 'pull_request'
    needs: [test-backend, test-backend-migrations, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
            image: usage-dashboard-backend
          - component: frontend
            dockerfile: frontend/Dockerfile
            image: usage-dashboard-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Validate reserved release source
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python scripts/application_release.py verify-source --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve checked-out short SHA
        id: source
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/skulldorom/${{ matrix.image }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ inputs.release_sha || github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag || format('v0.0.0-dev.{0}', github.sha) }}
          tags: |
            type=ref,event=branch,enable=${{ !inputs.release_tag }}
            type=ref,event=pr
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=latest,enable=${{ !inputs.release_tag && github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ steps.source.outputs.short }}
            type=raw,value=sha-${{ inputs.release_sha || github.sha }}

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ inputs.release_tag || format('v0.0.0-dev.{0}', github.sha) }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
