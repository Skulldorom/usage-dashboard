name: Docker images

on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - .github/workflows/docker-images.yml
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - .github/workflows/docker-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Test backend (pytest + Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest

      - name: Lint backend
        run: ruff check backend

      - name: Check backend formatting
        run: >-
          ruff format --check
          backend/app/datasources/service.py
          backend/app/models.py
          backend/tests/test_datasources.py
          backend/tests/test_postgres_migrations.py
          backend/alembic/versions/0011_session_id_text.py

  test-backend-migrations:
    name: Test backend migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: usage_dashboard
          POSTGRES_USER: usage_dashboard
          POSTGRES_PASSWORD: change-me
        options: >-
          --health-cmd "pg_isready -U usage_dashboard -d usage_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://usage_dashboard:change-me@localhost:5432/usage_dashboard
      ENCRYPTION_KEY: 1VlOu4U4FQvXf7z_UTd68N2IsJo87NZzxnqE6o-Wovs=
      POSTGRES_MIGRATION_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate Alembic migration chain
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify long session ID round trip
        working-directory: backend
        run: pytest tests/test_postgres_migrations.py

  test-frontend:
    name: Test frontend (test + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  build:
    name: Build ${{ matrix.component }} image
    if: github.event_name != 'pull_request'
    needs: [test-backend, test-backend-migrations, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
            image: usage-dashboard-backend
          - component: frontend
            dockerfile: frontend/Dockerfile
            image: usage-dashboard-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/skulldorom/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
