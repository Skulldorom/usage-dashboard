name: Application release

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      initial_base:
        description: 'First release only: reviewed baseline commit SHA (exclusive)'
        required: false
        type: string

permissions:
  contents: read

# Never cancel a partially published release; every attempt resumes the reserved tag first.
concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reserve or resume one release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_BASE: ${{ inputs.initial_base }}
        run: python scripts/application_release.py prepare --initial-base "$INITIAL_BASE"

  images:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-images.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify both registry artifacts then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python scripts/verify_release_images.py "$TAG" "$SHA"
          python scripts/application_release.py publish --tag "$TAG" --sha "$SHA"
