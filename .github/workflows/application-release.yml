name: Application release

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      initial_base:
        description: 'First release only: reviewed baseline commit SHA (exclusive)'
        required: false
        type: string

permissions:
  contents: read

# Never cancel a partially published release; every attempt resumes the reserved tag first.
concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reserve or resume one release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_BASE: ${{ inputs.initial_base }}
        run: python scripts/application_release.py prepare --initial-base "$INITIAL_BASE" ${{ github.event_name == 'push' && '--skip-unbootstrapped-push' || '' }}

  images:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/docker-images.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify both registry artifacts, promote stable channels, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python scripts/promote_release_images.py --tag "$TAG" --sha "$SHA" --execute
          python scripts/application_release.py publish --tag "$TAG" --sha "$SHA"

  evaluate-remaining:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Queue evaluation of commits received during the reserved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" != "$RELEASE_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/application-release.yml/dispatches" \
              --method POST -f ref=main
          fi
