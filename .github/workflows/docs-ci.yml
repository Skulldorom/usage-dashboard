name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".env.example"
      - "deploy/**"
      - "scripts/check-deployment-assets.sh"
      - "backend/Dockerfile"
      - "backend/app/core/config.py"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/docker-entrypoint.d/**"
      - "docker-compose.yml"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci --ignore-scripts

      - name: Validate deployment examples
        run: sh scripts/check-deployment-assets.sh

      - name: Build docs
        working-directory: docs
        run: npm run docs:build
