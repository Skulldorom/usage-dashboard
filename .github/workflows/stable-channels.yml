name: Stable channels

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Promote latest published stable release (false performs read-only verification)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

# Same lock as release reservation/publication; never cancel a partial promotion.
concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.confirm
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify current published stable release and optionally repair aliases
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          args=()
          if [ "$CONFIRM" = true ]; then args+=(--execute); fi
          python scripts/promote_release_images.py "${args[@]}"
