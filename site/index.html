<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usage Dashboard — self-hosted API usage dashboard</title>
    <meta
      name="description"
      content="Self-hosted API usage dashboard for Firecrawl, DeepSeek, OpenAI, Anthropic/Claude, OpenRouter, and custom HTTP endpoints."
    />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --cyan: #06c8ff;
        --violet: #8b5cf6;
        --violet-soft: #a78bfa;
        --purple: #4c1d95;
      }

      * { box-sizing: border-box; }
      html { background: #090713; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow-x: hidden;
        color: #fbf9ff;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090713;
      }
      a { color: inherit; text-decoration: none; }
      ::selection { color: #05020a; background: #48dbff; }

      .network-backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        opacity: 0.42;
        pointer-events: none;
        mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.72) 45%, transparent 92%);
      }
      .network-backdrop svg { width: 100%; height: 100%; min-height: 720px; }
      .network-lines { fill: none; stroke: rgba(160, 178, 196, 0.35); stroke-width: 1; }
      .network-lines path:nth-child(even) { stroke: rgba(139, 92, 246, 0.18); }
      .network-nodes { fill: rgba(167, 139, 250, 0.72); filter: drop-shadow(0 0 7px rgba(139, 92, 246, 0.45)); }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 26px clamp(24px, 5vw, 64px) 0;
      }
      .header-links { display: flex; align-items: center; gap: 12px; }
      .text-link {
        color: #b5adc1;
        font-size: 0.88rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: color 0.18s ease;
      }
      .text-link:hover { color: #fff; }
      .pill-button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 15px;
        border: 1px solid rgba(167, 139, 250, 0.42);
        border-radius: 999px;
        color: #bda7ff;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        background: rgba(139, 92, 246, 0.09);
        transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
      }
      .pill-button:hover {
        color: #fff;
        border-color: rgba(167, 139, 250, 0.7);
        background: rgba(139, 92, 246, 0.14);
        transform: translateY(-1px);
      }
      .pill-button svg { width: 15px; height: 15px; flex: none; }
      .brand-lockup { display: flex; align-items: center; gap: 12px; }
      .brand-mark { width: 45px; height: 42px; object-fit: contain; filter: drop-shadow(0 9px 10px rgba(0, 0, 0, 0.35)); }
      .brand-lockup strong { display: block; color: #fff; font-size: 1.05rem; letter-spacing: -0.02em; }
      .brand-lockup .brand-sub { display: block; margin-top: 1px; color: #82798e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.13em; }

      .social-icon-button {
        display: inline-grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        color: #d8d2de;
        background: rgba(255, 255, 255, 0.025);
        transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      }
      .social-icon-button:hover {
        color: #fff;
        border-color: rgba(167, 139, 250, 0.48);
        background: rgba(139, 92, 246, 0.10);
        transform: translateY(-1px);
      }
      .social-icon-button.small { width: 44px; height: 44px; }
      .social-icon-button.large { width: 60px; height: 60px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28); }
      .social-logo { width: 20px; height: 20px; display: block; }
      .social-icon-button.large .social-logo { width: 26px; height: 26px; }

      .landing-page { min-height: calc(100vh - 160px); display: grid; align-items: center; padding: 40px clamp(24px, 5vw, 64px) 40px; }
      .landing-hero {
        position: relative;
        width: min(100%, 1240px);
        justify-self: center;
        min-height: 560px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 410px);
        gap: clamp(28px, 5vw, 64px);
        align-items: center;
        padding: clamp(30px, 5vw, 64px);
        border: 1px solid rgba(167, 139, 250, 0.14);
        border-radius: 28px;
        background: rgba(16, 12, 29, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(14px);
        overflow: hidden;
      }
      .landing-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.035), transparent 30%);
      }
      .landing-copy { position: relative; z-index: 1; max-width: 760px; }
      .page-kicker {
        display: block;
        color: #bda7ff;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .landing-copy h1 {
        margin: 0;
        max-width: 760px;
        font-size: clamp(3rem, 7vw, 6.3rem);
        line-height: 0.88;
        font-weight: 800;
        letter-spacing: -0.045em;
      }
      .landing-description {
        max-width: 650px;
        margin: 26px 0 0;
        color: #aaa2b9;
        font-size: 1.05rem;
        line-height: 1.75;
      }
      .landing-actions { display: flex; align-items: center; gap: 14px; margin-top: 32px; }

      .cta-button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        border-radius: 999px;
        color: #05020a;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: -0.01em;
        background: #8b5cf6;
        box-shadow: 0 12px 34px rgba(139, 92, 246, 0.22);
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      }
      .cta-button:hover { transform: translateY(-2px); box-shadow: 0 16px 42px rgba(139, 92, 246, 0.3); filter: brightness(1.06); }
      .cta-button svg { width: 18px; height: 18px; flex: none; }

      .landing-card-stack { position: relative; z-index: 1; display: grid; gap: 16px; }
      .landing-stat-card {
        min-height: 118px;
        padding: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background: rgba(22, 17, 38, 0.82);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      }
      .landing-stat-card.primary {
        border-color: rgba(6, 200, 255, 0.32);
        background: rgba(139, 92, 246, 0.14);
      }
      .landing-stat-card span {
        display: block;
        color: #91879f;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .landing-stat-card strong {
        display: block;
        margin-top: 13px;
        color: #fff;
        font-size: clamp(1.45rem, 3vw, 2.2rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .site-footer {
        padding: 0 clamp(24px, 5vw, 64px) 30px;
        color: #5e566a;
        font-size: 0.78rem;
        text-align: center;
      }

      @media (max-width: 900px) {
        .landing-page { min-height: calc(100vh - 130px); }
        .landing-hero { grid-template-columns: 1fr; min-height: auto; }
        .landing-card-stack { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 600px) {
        .site-header { padding-top: 18px; }
        .landing-page { padding: 24px 18px 32px; }
        .landing-copy h1 { font-size: 3.1rem; }
        .landing-card-stack { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

          <div class="landing-copy">
            <span class="page-kicker">Private telemetry command center</span>
